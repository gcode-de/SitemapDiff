services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      DEMO_MODE: ${DEMO_MODE:-true}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/sitemapDiff}
      GOOGLE_ID: ${GOOGLE_ID:-local-demo-client}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-local-demo-secret}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-local-demo}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-local-demo}
      MAIL_TEST_RECIPIENT: ${MAIL_TEST_RECIPIENT:-demo@example.com}
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongodb-data:
